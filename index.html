<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#65D6E8" />
  <meta name="description" content="アフロのおじさんの髪をバリカンで全部剃る、スマホとPCで遊べる3Dブラウザゲーム。" />
  <meta property="og:title" content="アフロ、スッキリ。" />
  <meta property="og:description" content="刈って、つるっと、気分爽快。アフロを全剃りしてタイムとスコアを競おう。" />
  <meta property="og:type" content="website" />
  <!-- 公開先を変えたら og:url / og:image も公開URLに合わせて変更してください -->
  <meta property="og:url" content="https://infoairen7.github.io/afro-sukkiri/" />
  <meta property="og:image" content="https://infoairen7.github.io/afro-sukkiri/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>アフロ、スッキリ。</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='26' r='22' fill='%2328232A'/%3E%3Ccircle cx='32' cy='36' r='16' fill='%23EFB48B'/%3E%3Cpath d='M22 44c6 4 14 4 20 0' stroke='%2328232A' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="app" data-screen="loading">
    <div class="backdrop" aria-hidden="true">
      <div class="bd-wall"></div>
      <div class="bd-window"></div>
      <div class="bd-mirror"></div>
      <div class="bd-pole"><i></i></div>
      <div class="bd-plant"></div>
      <div class="bd-bokeh"></div>
    </div>

    <div class="shell">
      <header class="hud" id="hud">
        <button class="hud-btn" id="btn-pause" type="button" aria-label="一時停止">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
        <div class="hud-card">
          <div class="hud-time" id="hud-time-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 9v4.5l3 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9 2.5h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            <span class="hud-number" id="hud-time" aria-label="タイム">00:00.00</span>
          </div>
          <div class="hud-sep" aria-hidden="true"></div>
          <div class="hud-clean">
            <div class="hud-clean-row"><span class="hud-label">スッキリ</span><span class="hud-number" id="hud-clean">0.0%</span></div>
            <div class="meter" id="hud-meter" role="progressbar" aria-label="スッキリ率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="hud-bar"></i></div>
          </div>
        </div>
      </header>

      <main class="stage" id="stage">
        <canvas id="game-canvas" class="play-canvas" aria-label="3Dステージ。頭の上をなぞると髪を刈ります"></canvas>
        <div class="stage-ui">
          <span class="mode-chip" id="hud-mode">フリー</span>
          <div class="badge badge-interrupted" id="badge-interrupted" hidden>中断あり（練習扱い）</div>
          <div class="badge badge-boost" id="badge-boost" hidden>ブースト！</div>
          <div class="badge badge-rotate" id="badge-rotate" hidden>回転モード中：ドラッグで回す（刈れません）</div>
          <div class="guide-bubble" id="guide" hidden></div>
          <div class="assist-tip" id="assist-tip" hidden>のこりわずか！ 印のついた向きを見てみよう</div>
        </div>
      </main>

      <nav class="views" id="views" aria-label="視点を変える">
        <button class="view-btn" type="button" data-view="0" aria-pressed="true" aria-label="正面から見る（1）">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="15" r="10" class="ic-skin"/><path d="M7 13c0-7 18-7 18 0" class="ic-hair"/><circle cx="12.5" cy="15" r="1.4" class="ic-ink"/><circle cx="19.5" cy="15" r="1.4" class="ic-ink"/><path d="M12.5 19.5c2 1 5 1 7 0" class="ic-line"/></svg>
          <span>正面</span><i class="mark" aria-hidden="true"></i>
        </button>
        <button class="view-btn" type="button" data-view="1" aria-pressed="false" aria-label="右側から見る（2）">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="15" cy="15" r="10" class="ic-skin"/><path d="M6 14c0-8 15-9 18-2" class="ic-hair"/><path d="M24.5 15.5l2.5 2-2.6.8" class="ic-skin-s"/><circle cx="21" cy="14.5" r="1.4" class="ic-ink"/><circle cx="12" cy="17" r="2.6" class="ic-ear"/></svg>
          <span>右</span><i class="mark" aria-hidden="true"></i>
        </button>
        <button class="view-btn" type="button" data-view="2" aria-pressed="false" aria-label="後ろから見る（3）">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="15" r="10" class="ic-skin"/><path d="M6.5 16c-1-10 20-10 19 0" class="ic-hair"/><circle cx="6.5" cy="17" r="2.4" class="ic-ear"/><circle cx="25.5" cy="17" r="2.4" class="ic-ear"/></svg>
          <span>後ろ</span><i class="mark" aria-hidden="true"></i>
        </button>
        <button class="view-btn" type="button" data-view="3" aria-pressed="false" aria-label="左側から見る（4）">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="17" cy="15" r="10" class="ic-skin"/><path d="M26 14c0-8-15-9-18-2" class="ic-hair"/><path d="M7.5 15.5L5 17.5l2.6.8" class="ic-skin-s"/><circle cx="11" cy="14.5" r="1.4" class="ic-ink"/><circle cx="20" cy="17" r="2.6" class="ic-ear"/></svg>
          <span>左</span><i class="mark" aria-hidden="true"></i>
        </button>
        <button class="view-btn" type="button" data-view="4" aria-pressed="false" aria-label="上から見る（5）">
          <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="16" rx="10" ry="10" class="ic-skin"/><circle cx="16" cy="15" r="7" class="ic-hair"/><path d="M14.5 26.5l1.5 2 1.5-2" class="ic-skin-s"/></svg>
          <span>上</span><i class="mark" aria-hidden="true"></i>
        </button>
        <button class="view-btn rotate-btn" type="button" id="btn-rotate" aria-pressed="false" aria-label="自由回転モード（R）">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 17a8 8 0 1 0 3-8.5" class="ic-line"/><path d="M7.5 6.5l3.8 2.4-3.4 3" class="ic-line"/></svg>
          <span>回す</span>
        </button>
      </nav>

      <section class="tools" aria-label="バリカン">
        <div class="tool-list" id="tool-list" role="radiogroup" aria-label="バリカンを選ぶ"></div>
        <p class="tool-desc" id="tool-desc" aria-live="polite"></p>
      </section>

      <footer class="hint">
        <p class="hint-text" id="hint-text">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v4.5c0 3-2 5.5-5.5 5.5S7 19 6 16.5l-1.6-3.7a1.4 1.4 0 0 1 2.4-1.4L9 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="hint-msg">なぞって刈る</span>
        </p>
        <button class="hint-btn" type="button" id="btn-mute" aria-pressed="false" aria-label="音を消す">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path class="snd-on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="snd-off" d="M16 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="hint-btn" type="button" id="btn-settings" aria-label="設定">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </footer>
    </div>

    <section class="screen screen-title" id="screen-title" aria-labelledby="title-logo" hidden>
      <div class="title-head">
        <h1 class="logo" id="title-logo">
          <svg class="logo-clipper" viewBox="0 0 40 64" aria-hidden="true"><rect x="8" y="16" width="24" height="44" rx="12" fill="#123B4A"/><rect x="6" y="6" width="28" height="12" rx="3" fill="#123B4A"/><path d="M8 4h24" stroke="#123B4A" stroke-width="4" stroke-dasharray="2 2"/><circle cx="20" cy="32" r="4" fill="#65D6E8"/></svg>
          <span class="l1">アフロ、</span><span class="l2">スッキリ。</span>
        </h1>
        <p class="tagline">刈って、つるっと、気分爽快。</p>
      </div>
      <div class="title-spacer"></div>
      <div class="title-panel">
        <div class="mode-switch" role="radiogroup" aria-label="モード">
          <button type="button" role="radio" class="mode-opt" data-mode="free" aria-checked="true">スッキリフリー</button>
          <button type="button" role="radio" class="mode-opt" data-mode="ta" aria-checked="false">タイムアタック</button>
        </div>
        <p class="mode-desc" id="mode-desc"></p>
        <button class="btn-primary btn-start" type="button" id="btn-start"><span>はじめる</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="pill-row">
          <button class="pill" type="button" id="btn-pick-character"><img class="pill-img" id="pill-char-img" alt="" /><span class="pill-text"><span class="pill-k">おじさん</span><b id="pill-char-name"></b></span></button>
          <button class="pill" type="button" id="btn-pick-hair"><img class="pill-img" id="pill-hair-img" alt="" /><span class="pill-text"><span class="pill-k">髪型</span><b id="pill-hair-name"></b></span></button>
          <button class="pill" type="button" id="btn-pick-tool"><img class="pill-img" id="pill-tool-img" alt="" /><span class="pill-text"><span class="pill-k">バリカン</span><b id="pill-tool-name"></b></span></button>
        </div>
        <div class="link-row">
          <button type="button" class="link-btn" id="btn-records">記録</button>
          <button type="button" class="link-btn" id="btn-settings-title">設定</button>
          <button type="button" class="link-btn" id="btn-last-result" hidden>前回の結果</button>
        </div>
      </div>
    </section>

    <section class="screen screen-result" id="screen-result" aria-labelledby="result-title" hidden>
      <h2 class="result-title" id="result-title">つるっと完了！</h2>
      <div class="result-spacer"></div>
      <div class="result-panel">
        <div class="result-stats">
          <div class="stat"><span class="stat-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 9v4.5l3 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>タイム</span><span class="stat-value hud-number" id="res-time">00:00.00</span></div>
          <div class="stat"><span class="stat-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z" fill="#FFD15C" stroke="#c99a1e" stroke-width="1.2"/></svg>スコア</span><span class="stat-value stat-score hud-number" id="res-score">0</span></div>
          <div class="stat stat-rank"><span class="stat-label">ランク</span><span class="rank-medal" id="res-rank">-</span><span class="rank-title" id="res-rank-title"></span></div>
        </div>
        <p class="result-meta" id="res-meta"></p>
        <p class="result-sub" id="res-sub"></p>
        <div class="ba">
          <figure><img id="res-before" alt="ビフォー：剃る前" /><figcaption>BEFORE</figcaption></figure>
          <figure><img id="res-after" alt="アフター：つるつる" /><figcaption>AFTER</figcaption></figure>
        </div>
        <a class="btn-x" id="btn-x" href="https://x.com/intent/tweet" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.5z" fill="currentColor"/></svg>
          <span>Xで記録をポスト</span>
        </a>
        <button class="btn-outline" type="button" id="btn-save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>結果画像を保存</span></button>
        <button class="btn-outline" type="button" id="btn-share" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4M6 12v7h12v-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>画像を共有</span></button>
        <p class="share-note" id="share-note">Xの投稿画面に画像は自動で付きません。保存した画像を投稿画面で添付してください。</p>
        <div class="share-fallback" id="share-fallback" hidden>
          <p id="share-fallback-text"></p>
          <div class="row"><button class="btn-ghost" type="button" id="btn-copy-text">文面をコピー</button><button class="btn-ghost" type="button" id="btn-retry-card">画像をもう一度作る</button></div>
        </div>
        <div class="result-actions">
          <button class="btn-primary" type="button" id="btn-again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 3.5v4h-4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>もう一度</span></button>
          <button class="btn-ghost" type="button" id="btn-to-title">タイトルへ</button>
        </div>
      </div>
    </section>

    <section class="screen screen-loading" id="screen-loading" aria-live="polite">
      <div class="loading-card">
        <p class="logo small"><span class="l1">アフロ、</span><span class="l2">スッキリ。</span></p>
        <div class="progress" role="progressbar" aria-label="読み込み" aria-valuemin="0" aria-valuemax="100" id="load-progress"><i id="load-bar"></i></div>
        <p class="load-text" id="load-text">読み込み中…</p>
        <div class="load-error" id="load-error" hidden>
          <p id="load-error-text"></p>
          <button class="btn-primary" type="button" id="btn-retry">もう一度読み込む</button>
        </div>
      </div>
    </section>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <header class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-close" type="button" id="sheet-close" aria-label="閉じる">×</button></header>
      <div class="sheet-body" id="sheet-body"></div>
    </section>

    <div class="dialog-backdrop" id="dialog-backdrop" hidden>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-text">
        <h2 id="dialog-title"></h2>
        <p id="dialog-text"></p>
        <div class="dialog-actions" id="dialog-actions"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <noscript><p class="noscript">このゲームを遊ぶにはJavaScriptを有効にしてください。</p></noscript>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
